name: Live provider soak

on:
  workflow_dispatch:
    inputs:
      model:
        description: Provider/model identifier
        required: false
        default: openrouter/~deepseek/deepseek-v4-flash-latest
      critic_model:
        description: Critic provider/model identifier
        required: false
        default: openrouter/~openai/gpt-mini-latest
  schedule:
    - cron: "17 7 * * 1"

concurrency:
  group: live-provider-soak
  cancel-in-progress: false

jobs:
  soak:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install OpenCode
        run: bun install --global opencode-ai@1.18.19
      - name: Prove one bounded server-transport provider turn
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ARBOR_SOAK_MODEL: ${{ inputs.model || 'openrouter/~deepseek/deepseek-v4-flash-latest' }}
          ARBOR_SOAK_CRITIC_MODEL: ${{ inputs.critic_model || 'openrouter/~openai/gpt-mini-latest' }}
          ARBOR_SOAK_TIMEOUT_MS: "300000"
          ARBOR_SOAK_HEARTBEAT_MS: "15000"
          ARBOR_SOAK_RESULT: live-provider-soak-result.json
        run: bun scripts/live-provider-soak.mjs
      - name: Upload secret-free result envelope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-provider-soak-result
          path: live-provider-soak-result.json
          if-no-files-found: error
          retention-days: 30
